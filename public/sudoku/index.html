<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#5668f5"/>
<meta name="description" content="轻量游戏站数独挑战，支持五档难度、候选数、笔记、提示、统计与自动存档。"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="数独"/>
<title>数独挑战 · 轻量游戏站</title>
<link rel="stylesheet" href="../ui-foundation.css?v=20260822a"/>
<link rel="stylesheet" href="sudoku.css?v=20260822d"/>
</head>
<body>

<!-- ========== SECTION 2: HTML 结构 ========== -->

<!-- 2.1 烟花容器 -->
<div class="fireworks-wrap" id="fireworksWrap">
  <div class="fireworks-left"  id="fwLeft"></div>
  <div class="fireworks-right" id="fwRight"></div>
</div>

<div class="page-shell">
<!-- 2.2 数独自己的大厅：先选择继续或新局，不再点进来就直接计时 -->
<section class="sudoku-home" id="sudokuHome" aria-labelledby="sudokuHomeTitle">
  <nav class="home-nav">
    <a class="platform-back ui-button ui-button--secondary" href="../" aria-label="返回小游戏平台">← 游戏大厅</a>
    <button type="button" class="home-stats ui-button ui-button--secondary" id="homeStatsBtn">▥ 我的战绩</button>
  </nav>
  <div class="home-hero">
    <div class="home-logo" aria-hidden="true"><span>九</span></div>
    <div class="home-heading"><span class="home-eyebrow">Puzzle Sudoku</span><h1 id="sudokuHomeTitle">数独挑战</h1><p>一次专注一盘，在九宫格里找回秩序</p></div>
  </div>

  <div class="sudoku-menu">
    <article class="resume-card resume-entry" id="homeResumeCard" hidden>
      <div class="resume-icon" aria-hidden="true">↻</div>
      <div class="resume-copy">
        <span class="resume-kicker">进度已自动保存</span>
        <strong id="homeResumeTitle">继续上局</strong>
        <span id="homeResumeMeta">简单 · 00:00 · 完成 0%</span>
      </div>
      <button type="button" class="ui-button ui-button--secondary" id="homeResumeBtn">继续 <b>→</b></button>
    </article>

    <button type="button" class="sudoku-entry new-game-entry ui-button" id="openNewGameBtn" aria-expanded="false" aria-controls="newGameConfig">
      <span class="sudoku-entry-icon" aria-hidden="true">九</span>
      <span class="sudoku-entry-copy"><span class="sudoku-entry-kicker">NEW GAME</span><span class="sudoku-entry-title">开始新局</span><span class="sudoku-entry-desc">选择难度，开启一盘新的数独</span></span>
      <span class="sudoku-entry-arrow" aria-hidden="true">→</span>
    </button>
    <section class="new-game-card" id="newGameConfig" hidden aria-labelledby="newGameTitle">
      <div class="section-heading"><div><span>新建一局</span><h2 id="newGameTitle">选择适合现在的难度</h2></div><span class="unique-badge">每局唯一解</span></div>
      <div class="difficulty-cards" id="homeDifficulty" role="radiogroup" aria-label="选择数独难度">
        <button type="button" class="difficulty-card active" data-diff="0" role="radio" aria-checked="true"><b>简单</b><span>轻松热身</span><small>40 个已知数</small></button>
        <button type="button" class="difficulty-card" data-diff="1" role="radio" aria-checked="false"><b>中等</b><span>日常一局</span><small>34 个已知数</small></button>
        <button type="button" class="difficulty-card" data-diff="2" role="radio" aria-checked="false"><b>困难</b><span>专注挑战</span><small>30 个已知数</small></button>
        <button type="button" class="difficulty-card" data-diff="3" role="radio" aria-checked="false"><b>专家</b><span>进阶推理</span><small>26 个已知数</small></button>
        <button type="button" class="difficulty-card" data-diff="4" role="radio" aria-checked="false"><b>极限</b><span>高手试炼</span><small>23 个已知数</small></button>
      </div>
      <button type="button" class="start-game-btn ui-button ui-button--primary" id="homeStartBtn">开始新局 <span>→</span></button>
    </section>
  </div>

  <div class="feature-strip" aria-label="数独功能">
    <span><b>✎</b> 候选笔记</span><span><b>💡</b> 智能提示</span><span><b>↩</b> 随时撤销</span><span><b>▣</b> 自动存档</span>
  </div>
  <p class="home-tip">玩法：每一行、每一列和每个 3×3 宫内，数字 1–9 都不能重复。</p>
</section>

<!-- 2.3 沉浸式游戏页 -->
<section class="game-screen" id="sudokuGame" hidden>
  <header class="topbar">
    <button type="button" class="game-home-btn ui-button ui-button--secondary" id="gameHomeBtn" aria-label="返回数独首页">← 数独首页</button>
    <div class="title-wrap">
      <span class="eyebrow" id="gameDifficulty">简单 · Puzzle Sudoku</span>
      <div class="title">数独挑战</div>
    </div>
    <div class="top-actions">
      <div class="timer" id="timerText">⏱ 00:00</div>
      <div class="right-btns">
        <button type="button" class="icon-btn" id="fullscreenBtn" title="进入沉浸全屏" aria-label="进入沉浸全屏">⛶</button>
        <button type="button" class="icon-btn" id="soundBtn" title="切换音效" aria-label="切换音效">🔊</button>
        <button type="button" class="icon-btn" id="darkBtn" title="切换深色模式" aria-label="切换深色模式">🌙</button>
      </div>
    </div>
  </header>

  <main class="card">
    <div class="board-column">
      <div class="progress-box">
        <span id="progressText">进度：0%</span>
        <progress id="progressBar" value="0" max="100"></progress>
      </div>
      <div class="finish-msg" id="finishMsg" style="display:none;"></div>
      <div class="sudoku-board" id="board" role="grid" aria-label="数独棋盘"></div>
      <div class="keypad" id="keypad" aria-label="数字键盘"></div>
    </div>

    <aside class="control-panel" aria-label="数独工具">
      <div class="tool-label">常用工具</div>
      <div class="bottom-bar tool-grid primary-tools">
        <button type="button" id="noteBtn" aria-pressed="false">✎ 笔记：关</button>
        <button type="button" id="candBtn" aria-pressed="false" title="显示或隐藏自动计算的候选数">▦ 候选辅助：关</button>
        <button type="button" id="undoBtn">↩ 撤销</button>
        <button type="button" id="hintBtn">💡 提示</button>
      </div>
      <details class="advanced-tools">
        <summary>更多辅助 <span>⌄</span></summary>
        <div class="bottom-bar tool-grid secondary-tools">
          <button type="button" id="techHintBtn" title="技巧提示">🧠 技巧</button>
          <button type="button" id="statsBtn">▥ 统计</button>
          <button type="button" id="autoFillBtn" aria-pressed="false" title="自动填入唯一候选">⚡ 自动填入：关</button>
          <button type="button" id="clearBoardBtn" class="danger-tool">⌫ 清空填写</button>
        </div>
      </details>
    </aside>
  </main>
</section>
</div>

<!-- 2.4 统计弹窗 -->
<div class="modal-overlay" id="statsOverlay" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="statsTitle">
  <div class="modal-box ui-modal" tabindex="-1">
    <button type="button" class="modal-close" id="statsCloseBtn" aria-label="关闭统计">✕</button>
    <h2 id="statsTitle">📊 我的战绩</h2>
    <table class="stats-table" id="statsTable">
      <thead><tr><th>难度</th><th>完成次数</th><th>最佳用时</th><th>平均用时</th></tr></thead>
      <tbody id="statsBody"></tbody>
    </table>
    <div class="stats-btns">
      <button type="button" class="danger-btn" id="clearStatsBtn">清除统计</button>
      <button type="button" id="statsDoneBtn">关闭</button>
    </div>
  </div>
</div>

<!-- 2.5 技巧提示弹窗 -->
<div class="modal-overlay" id="techHintOverlay" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="techHintTitle">
  <div class="modal-box ui-modal" tabindex="-1">
    <button type="button" class="modal-close" id="techHintCloseBtn" aria-label="关闭技巧提示">✕</button>
    <h2 id="techHintTitle">💡 技巧提示</h2>
    <div id="techHintBody" class="tech-hint-body"></div>
    <div class="stats-btns">
      <button type="button" id="techHintDoneBtn">关闭</button>
    </div>
  </div>
</div>

<!-- 2.6 分享弹窗 -->
<div class="modal-overlay" id="shareOverlay" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="shareTitle">
  <div class="modal-box ui-modal" tabindex="-1">
    <button type="button" class="modal-close" id="shareCloseBtn" aria-label="关闭分享">✕</button>
    <h2 id="shareTitle">📤 分享成绩</h2>
    <canvas id="shareCanvas" width="360" height="480" class="share-canvas"></canvas>
    <div class="stats-btns">
      <button type="button" id="shareDownloadBtn">保存图片</button>
      <button type="button" id="shareDoneBtn">关闭</button>
    </div>
  </div>
</div>

<script src="sudoku.js?v=20260822d"></script>
</body>
</html>
