<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#5668f5"/>
<meta name="description" content="轻量游戏站数独挑战，支持五档难度、候选数、笔记、提示、统计与自动存档。"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="数独"/>
<title>数独挑战 · 轻量游戏站</title>
<link rel="stylesheet" href="sudoku.css?v=20260820b"/>
</head>
<body>

<!-- ========== SECTION 2: HTML 结构 ========== -->

<!-- 2.1 烟花容器 -->
<div class="fireworks-wrap" id="fireworksWrap">
  <div class="fireworks-left"  id="fwLeft"></div>
  <div class="fireworks-right" id="fwRight"></div>
</div>

<div class="page-shell">
<!-- 2.2 顶部栏 -->
<header class="topbar">
  <a class="platform-back" href="../" aria-label="返回小游戏平台">← 游戏大厅</a>
  <div class="title-wrap">
    <span class="eyebrow">Puzzle Sudoku</span>
    <div class="title">数独挑战</div>
  </div>
  <div class="top-actions">
    <div class="timer" id="timerText">⏱ 0 秒</div>
    <div class="right-btns">
      <button type="button" class="icon-btn" id="soundBtn" title="切换音效" aria-label="切换音效">🔊</button>
      <button type="button" class="icon-btn" id="darkBtn" title="切换深色模式" aria-label="切换深色模式">🌙</button>
    </div>
  </div>
</header>

<!-- 2.3 主卡片（棋盘 + 键盘 + 底部栏）-->
<main class="card">
  <div class="progress-box">
    <span id="progressText">进度：0%</span>
    <progress id="progressBar" value="0" max="100"></progress>
  </div>
  <div class="finish-msg" id="finishMsg" style="display:none;"></div>
  <div class="sudoku-board" id="board" role="grid" aria-label="数独棋盘"></div>
  <div class="keypad" id="keypad"></div>
  <div class="tool-label">难度与新局</div>
  <div class="bottom-bar">
    <select class="difficulty-select" id="diffSelect" aria-label="选择数独难度">
      <option value="0">简单 · 40 个提示</option>
      <option value="1">中等 · 34 个提示</option>
      <option value="2">困难 · 30 个提示</option>
      <option value="3">专家 · 26 个提示</option>
      <option value="4">极限 · 23 个提示</option>
    </select>
    <button type="button" class="primary-tool" id="newGameBtn">新游戏</button>
  </div>
  <div class="tool-label">辅助工具</div>
  <div class="bottom-bar tool-grid">
    <button type="button" id="noteBtn">✎ 笔记：关</button>
    <button type="button" id="candBtn">▦ 候选：关</button>
    <button type="button" id="undoBtn">↩ 撤销</button>
    <button type="button" id="hintBtn">💡 提示</button>
    <button type="button" id="techHintBtn" title="技巧提示">🧠 技巧</button>
    <button type="button" id="statsBtn">▥ 统计</button>
    <button type="button" id="autoFillBtn" title="自动填入唯一候选">⚡ 自动填入：关</button>
  </div>
</main>
</div>

<!-- 2.4 统计弹窗 -->
<div class="modal-overlay" id="statsOverlay">
  <div class="modal-box">
    <button type="button" class="modal-close" id="statsCloseBtn" aria-label="关闭统计">✕</button>
    <h2>📊 游戏统计</h2>
    <table class="stats-table" id="statsTable">
      <thead><tr><th>难度</th><th>完成次数</th><th>最佳用时</th><th>平均用时</th></tr></thead>
      <tbody id="statsBody"></tbody>
    </table>
    <div class="stats-btns">
      <button type="button" class="danger-btn" id="clearStatsBtn">清除统计</button>
      <button type="button" id="statsDoneBtn">关闭</button>
    </div>
  </div>
</div>

<!-- 2.5 继续游戏弹窗 -->
<div class="resume-overlay" id="resumeOverlay">
  <div class="resume-box">
    <h3>发现未完成的游戏</h3>
    <p id="resumeInfo">是否继续上局的游戏？</p>
    <div class="resume-btns">
      <button type="button" id="resumeBtn">继续游戏</button>
      <button type="button" id="discardBtn">重新开始</button>
    </div>
  </div>
</div>

<!-- 2.6 技巧提示弹窗 -->
<div class="modal-overlay" id="techHintOverlay">
  <div class="modal-box">
    <button type="button" class="modal-close" id="techHintCloseBtn" aria-label="关闭技巧提示">✕</button>
    <h2>💡 技巧提示</h2>
    <div id="techHintBody" class="tech-hint-body"></div>
    <div class="stats-btns">
      <button type="button" id="techHintDoneBtn">关闭</button>
    </div>
  </div>
</div>

<!-- 2.7 分享弹窗 -->
<div class="modal-overlay" id="shareOverlay">
  <div class="modal-box">
    <button type="button" class="modal-close" id="shareCloseBtn" aria-label="关闭分享">✕</button>
    <h2>📤 分享成绩</h2>
    <canvas id="shareCanvas" width="360" height="480" class="share-canvas"></canvas>
    <div class="stats-btns">
      <button type="button" id="shareDownloadBtn">保存图片</button>
      <button type="button" id="shareDoneBtn">关闭</button>
    </div>
  </div>
</div>

<script src="sudoku.js?v=20260821b"></script>
</body>
</html>
