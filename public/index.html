<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eef3ff">
  <meta name="description" content="轻量游戏站：选择 24 点大挑战或数独挑战。">
  <title>轻量游戏站</title>
  <link rel="stylesheet" href="platform.css?v=20260821c">
  <script src="platform.js?v=20260821a" defer></script>
</head>
<body>
  <main class="platform-shell">
    <header class="platform-hero">
      <div class="platform-mark" aria-hidden="true">玩</div>
      <div class="eyebrow">Light Games</div>
      <h1>轻量游戏站</h1>
      <p>随时来一局脑力挑战<br>选择你现在想玩的游戏</p>
    </header>

    <nav class="game-grid" aria-label="选择游戏">
      <a class="game-card math" href="24/">
        <span class="game-card-icon" aria-hidden="true">24</span>
        <h2>24 点大挑战</h2>
        <p>四张牌凑出 24，支持闯关、竞速和好友实时对战。</p>
        <span class="game-tags"><span>80 大关</span><span>实时联机</span><span>好友对战</span></span>
      </a>

      <a class="game-card sudoku" href="sudoku/">
        <span class="game-card-icon" aria-hidden="true">九</span>
        <h2>数独挑战</h2>
        <p>先选难度或继续存档，再进入沉浸式全屏棋盘。</p>
        <span class="game-tags"><span>唯一解</span><span>沉浸全屏</span><span>断点续玩</span></span>
      </a>
    </nav>

    <p class="platform-note">两款游戏独立运行、独立保存进度；24 点邀请链接可直接进入联机房间。</p>
  </main>
</body>
</html>
