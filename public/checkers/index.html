<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eef3ff">
  <meta name="description" content="中国跳棋玩法大厅，支持人机对战、本地双人和好友对战。">
  <title>中国跳棋 · 选择玩法</title>
  <link rel="stylesheet" href="../ui-foundation.css?v=20260822a">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="checkers.css?v=20260822b">
  <script src="lobby.js?v=20260822c" defer></script>
</head>
<body class="lobby-page">
  <main class="lobby-shell">
    <nav class="lobby-nav">
      <a class="nav-back ui-button ui-button--secondary" href="../" aria-label="返回游戏平台">← 游戏大厅</a>
      <span>轻量游戏站</span>
      <span class="nav-status">3 种对战方式</span>
    </nav>

    <section class="lobby-hero" aria-labelledby="lobbyTitle">
      <div class="hero-board" aria-hidden="true">
        <span class="hero-piece red p1"></span><span class="hero-piece red p2"></span><span class="hero-piece red p3"></span>
        <span class="hero-star">✦</span>
        <span class="hero-piece blue p4"></span><span class="hero-piece blue p5"></span><span class="hero-piece blue p6"></span>
      </div>
      <div class="hero-copy">
        <span class="eyebrow">Chinese Checkers</span>
        <h1 id="lobbyTitle">中国跳棋</h1>
        <p>选一种舒服的方式开局。进入棋局后只保留棋盘和必要操作，专注每一步。</p>
      </div>
    </section>

    <section class="mode-section" aria-labelledby="modeTitle">
      <div class="section-heading">
        <div><span>开始一局</span><h2 id="modeTitle">选择玩法</h2></div>
        <span class="section-badge">己方始终在下</span>
      </div>

      <div class="mode-menu">
        <button type="button" class="mode-entry ai-entry ui-button" id="selectAiBtn" aria-expanded="false" aria-controls="aiConfig">
          <span class="mode-icon" aria-hidden="true"><i class="fa-solid fa-robot" aria-hidden="true"></i></span>
          <span class="mode-copy"><span class="mode-kicker">SOLO</span><span class="mode-entry-title">人机对战</span><span class="mode-entry-desc">磨练路线和连续跳跃</span></span>
          <span class="mode-arrow" aria-hidden="true">→</span>
        </button>
        <section class="mode-config ai-config" id="aiConfig" hidden aria-label="人机对战设置">
          <span class="config-label">选择电脑难度</span>
          <div class="difficulty-picker" role="radiogroup" aria-label="选择电脑难度">
            <button type="button" data-level="easy" role="radio" aria-checked="false">轻松</button>
            <button type="button" class="active" data-level="normal" role="radio" aria-checked="true">标准</button>
            <button type="button" data-level="hard" role="radio" aria-checked="false">困难</button>
          </div>
          <button type="button" class="mode-start primary ui-button ui-button--primary" id="startAiBtn"><span id="startAiLabel">开始人机对战</span> <span aria-hidden="true">→</span></button>
        </section>

        <button type="button" class="mode-entry local-entry ui-button" id="startLocalBtn">
          <span class="mode-icon" aria-hidden="true"><i class="fa-solid fa-users" aria-hidden="true"></i></span>
          <span class="mode-copy"><span class="mode-kicker">TOGETHER</span><span class="mode-entry-title" id="startLocalLabel">本地双人</span><span class="mode-entry-desc">一台设备，固定红方视角</span></span>
          <span class="mode-arrow" aria-hidden="true">→</span>
        </button>

        <button type="button" class="mode-entry online-entry ui-button" id="selectOnlineBtn" aria-expanded="false" aria-controls="onlineCard">
          <span class="mode-icon" aria-hidden="true"><i class="fa-solid fa-earth-asia" aria-hidden="true"></i></span>
          <span class="mode-copy"><span class="mode-kicker">ONLINE</span><span class="mode-entry-title">好友对战</span><span class="mode-entry-desc">创建房间，和朋友实时对战</span></span>
          <span class="mode-arrow" aria-hidden="true">→</span>
        </button>
        <section class="mode-config online-config" id="onlineCard" hidden aria-label="好友对战设置">
          <span class="config-label">先选联机方式，再补充必要信息</span>
          <div class="online-fields">
            <label><span>显示昵称</span><input class="ui-input" id="nickInput" type="text" maxlength="16" autocomplete="nickname" placeholder="朋友会看到这个名字"></label>
          </div>
          <div class="online-intents" role="group" aria-label="选择联机方式">
            <button type="button" class="online-intent create-intent ui-button" id="createRoomBtn"><strong>创建房间</strong><span>生成邀请，等朋友加入</span></button>
            <button type="button" class="online-intent join-intent ui-button" id="openJoinRoomBtn" aria-expanded="false" aria-controls="joinRoomConfig"><strong>加入朋友房间</strong><span>输入收到的房间码</span></button>
          </div>
          <section class="online-join-config" id="joinRoomConfig" hidden aria-label="加入朋友房间">
            <div class="online-fields">
              <label><span>房间码</span><input class="ui-input" id="roomInput" type="text" maxlength="5" autocomplete="off" spellcheck="false" placeholder="输入 5 位房间码"></label>
            </div>
            <button type="button" class="mode-start primary ui-button ui-button--primary" id="joinRoomBtn">加入房间 <span aria-hidden="true">→</span></button>
          </section>
          <p class="field-error" id="fieldError" role="alert" hidden></p>
        </section>
      </div>
    </section>

    <div class="feature-strip" aria-label="跳棋功能">
      <span><b>⌁</b> 连跳路线</span><span><b>◎</b> 上一步标记</span><span><b>↻</b> 断线重连</span><span><b>✓</b> 服务端判定</span>
    </div>
    <p class="lobby-tip">玩法：移动到相邻空位，或隔着任意棋子连续跳跃；率先将 10 枚棋子全部移入对面营地获胜。</p>
  </main>
</body>
</html>
