<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#eef3ff" />
  <meta name="description" content="五子棋对局页（单机人机）。" />
  <title>五子棋 · 对局</title>
  <link rel="stylesheet" href="../ui-foundation.css?v=6aafc30c28ed" />
  <link rel="stylesheet" href="gomoku.css?v=3e5acd60d81e" />
  <script src="gomoku_core.js?v=9f0364cabc9b" defer></script>
  <script src="gomoku_net.js?v=32477c5ca233" defer></script>
  <script src="gomoku.js?v=41932a476d70" defer></script>
</head>
<body class="gomoku-play-page">
  <main class="gomoku-shell">
    <header class="game-topbar">
      <a class="nav-back ui-button ui-button--secondary gomoku-nav-btn" href="./" aria-label="返回五子棋首页">← 五子棋首页</a>
      <div class="game-title">
        <span>Gomoku</span>
        <strong id="gameTitle">五子棋</strong>
      </div>
      <div class="top-actions">
        <span id="netBadge" class="net-badge" hidden></span>
        <span id="modeBadge" class="mode-badge">单机人机</span>
      </div>
    </header>

    <section class="turn-panel ui-panel" aria-live="polite">
      <strong id="turnText">黑方先手</strong>
      <span id="turnSub">落子后切换对手</span>
      <span id="moveText">第 0 手</span>
    </section>

    <section class="gomoku-layout">
      <section class="board-panel ui-panel">
        <div id="boardWrap" class="board-wrap">
          <div id="gomokuBoard" class="gomoku-board" role="grid" aria-label="五子棋棋盘" aria-describedby="boardAssist"></div>
        </div>
        <p id="boardAssist" class="visually-hidden">方向键可移动焦点，回车/空格落子。空位点击一次后会显示预览，再次点击该点可完成落子。</p>
        <p id="hintText" class="board-hint"></p>
      </section>

      <aside class="side-panel ui-panel">
        <div class="side-title">对局信息</div>
        <div class="player-row" id="blackRow">
          <span class="player-chip chip-black"></span>
          <div>
            <strong id="blackName">黑方</strong>
            <small id="blackSub">先手</small>
          </div>
          <b id="blackCount">0</b>
        </div>
        <div class="player-row" id="whiteRow">
          <span class="player-chip chip-white"></span>
          <div>
            <strong id="whiteName">白方</strong>
            <small id="whiteSub">后手</small>
          </div>
          <b id="whiteCount">0</b>
        </div>

        <section class="room-panel" id="roomPanel" hidden aria-label="联机房间信息">
          <div class="side-title">联机房间</div>
          <div class="room-code-row">
            <span class="room-code" id="roomCode">-----</span>
            <button type="button" id="copyInviteBtn" class="ui-button ui-button--secondary gomoku-room-copy">复制邀请</button>
          </div>
          <p class="room-players" id="roomPlayers">正在连接…</p>
          <button type="button" id="leaveRoomBtn" class="ui-button ui-button--secondary gomoku-room-leave">退出房间</button>
        </section>

        <div class="control-grid" aria-label="棋局操作">
          <button type="button" id="undoBtn" class="ui-button ui-button--secondary gomoku-control-btn gomoku-undo-btn">↩ 悔棋</button>
          <button type="button" id="resetBtn" class="ui-button ui-button--secondary gomoku-control-btn gomoku-reset-btn">↻ 重新开局</button>
        </div>

        <details class="rule-card">
          <summary>五子棋规则 <span>⌄</span></summary>
          <p>1. 先手是黑棋，先下 1 子。</p>
          <p>2. 任一方向连续 5 子即为胜利。</p>
          <p>3. 人机为「你对 AI」，AI 为白棋。</p>
        </details>

        <p class="status-caption">对局状态会实时保存在浏览器，离开后可继续。</p>
      </aside>
    </section>

    <div id="resultOverlay" class="result-overlay" role="dialog" aria-modal="true" aria-labelledby="resultTitle" aria-describedby="resultText" aria-hidden="true" tabindex="-1">
      <div class="result-card ui-modal">
        <h2 id="resultTitle">本局结束</h2>
        <p id="resultText">黑方获胜</p>
        <button type="button" id="resultRestart" class="ui-button ui-button--primary gomoku-result-btn">再来一局</button>
      </div>
    </div>
  </main>
</body>
</html>
