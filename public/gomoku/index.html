<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#eef3ff" />
  <meta name="description" content="五子棋：单机人机和本地双人对战，15x15 经典对局。" />
  <title>五子棋 · 选择玩法</title>
  <link rel="stylesheet" href="../ui-foundation.css?v=20260822a" />
  <link rel="stylesheet" href="gomoku.css?v=20260830a" />
  <script src="gomoku-index.js?v=20260830a" defer></script>
</head>
<body class="gomoku-lobby-page">
  <main class="ui-lobby gomoku-lobby-shell">
    <nav class="lobby-nav">
      <a class="nav-back ui-button ui-button--secondary" href="../" aria-label="返回游戏大厅">← 游戏大厅</a>
      <span>轻量游戏站</span>
      <span class="lobby-mode-badge">单机 · 双人本地</span>
    </nav>

    <section class="lobby-hero" aria-labelledby="gomokuHeroTitle">
      <div class="hero-badge" aria-hidden="true">五</div>
      <div class="hero-copy">
        <span class="eyebrow">Gomoku</span>
        <h1 id="gomokuHeroTitle">五子棋</h1>
        <p>五子连珠赢，支持人机对弈和同屏双人。</p>
      </div>
    </section>

    <section class="mode-grid" aria-label="玩法选择">
      <article class="mode-card ui-panel">
        <div class="mode-head">
          <span class="mode-icon mode-icon-ai">👤</span>
          <span>
            <strong>单机人机</strong>
            <small>你执黑，系统执白</small>
          </span>
          <span class="mode-chip">AI 对局</span>
        </div>
        <p>不需要联网，一局定胜负。支持悔棋、继续上局与自动存档。</p>
        <button type="button" id="startAiBtn" class="mode-btn ui-button ui-button--primary">进入对战</button>
      </article>

      <article class="mode-card ui-panel">
        <div class="mode-head">
          <span class="mode-icon mode-icon-local">👥</span>
          <span>
            <strong>本地双人</strong>
            <small>两位玩家同屏交替</small>
          </span>
          <span class="mode-chip chip-alt">双人模式</span>
        </div>
        <p>固定黑白先后顺序，支持暂停后继续，本地断点自动保存。</p>
        <button type="button" id="startLocalBtn" class="mode-btn ui-button ui-button--accent">进入对战</button>
      </article>
    </section>

    <div class="feature-strip" aria-label="五子棋功能">
      <span><b>✓</b> 15×15 标准棋盘</span>
      <span><b>✓</b> 五子连珠即胜</span>
      <span><b>✓</b> 断点续玩</span>
      <span><b>✓</b> 悔棋与重开</span>
    </div>

    <p class="lobby-tip">AI 为近似智能：先手杀法、阻挡与线段评估，支持策略级进阶版本扩展。</p>
  </main>
</body>
</html>
